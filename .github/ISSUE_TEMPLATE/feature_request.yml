name: Feature request
description: 提議新能力或使用體驗改善
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解決的問題
      description: 請描述使用情境，而不只是指定實作。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建議方案
      description: 說明操作流程、替代方案與成功標準。
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 影響
      description: API、設定、模型、GPU/RAM/磁碟、隱私、安全與相容性。
  - type: checkboxes
    id: checks
    attributes:
      label: 確認
      options:
        - label: 我已搜尋現有 Issue 與文件。
          required: true
        - label: 此提案不包含 Secret、個資或未授權資料。
          required: true
