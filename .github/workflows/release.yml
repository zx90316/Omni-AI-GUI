name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix; must match omni_version.py"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows standalone
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            manager/requirements.txt
            requirements-build.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve and validate version
        id: version
        shell: pwsh
        run: |
          $sourceVersion = (python -c "from omni_version import __version__; print(__version__)").Trim()
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.version }}") {
            $requestedVersion = "${{ inputs.version }}".TrimStart("v")
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $requestedVersion = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $requestedVersion = $sourceVersion
          }
          if ($requestedVersion -ne $sourceVersion) {
            throw "Requested version '$requestedVersion' does not match omni_version.py '$sourceVersion'."
          }
          "version=$sourceVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$sourceVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r manager/requirements.txt -r requirements-build.txt

      - name: Run packaging tests
        run: python -m unittest -v tests.test_release_packaging

      - name: Verify Frontend source independently
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Import optional Authenticode certificate
        id: certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_BASE64) {
            "thumbprint=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "No signing certificate configured; producing an unsigned artifact."
            exit 0
          }
          if (-not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            throw "WINDOWS_CERTIFICATE_PASSWORD is required when a certificate is configured."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "omni-code-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          )
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate `
            -FilePath $certificatePath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password
          Remove-Item -LiteralPath $certificatePath -Force
          "thumbprint=$($certificate.Thumbprint)" | Out-File `
            -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build verified Nuitka release
        shell: pwsh
        run: |
          $buildParameters = @{
            ReleaseVersion = "${{ steps.version.outputs.version }}"
            SkipInstall = $true
          }
          if ("${{ steps.certificate.outputs.thumbprint }}") {
            $buildParameters.CertThumbprint = "${{ steps.certificate.outputs.thumbprint }}"
          }
          ./scripts/build_nuitka.ps1 @buildParameters

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Omni-AI-Manager-${{ steps.version.outputs.version }}-windows-x64-standalone
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error

      - name: Attest release provenance
        uses: actions/attest@v4
        with:
          subject-path: release/*.zip

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $assets = Get-ChildItem -LiteralPath release -File |
            Where-Object { $_.Extension -eq ".zip" -or $_.Name.EndsWith(".zip.sha256") } |
            Select-Object -ExpandProperty FullName
          if (-not $assets) { throw "No release assets were produced." }
          gh release view $env:RELEASE_TAG --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $assets --clobber --repo "${{ github.repository }}"
          } else {
            $arguments = @(
              "release", "create", $env:RELEASE_TAG,
              "--repo", "${{ github.repository }}",
              "--target", "${{ github.sha }}",
              "--title", "Omni AI Manager $env:RELEASE_TAG",
              "--generate-notes"
            )
            if ($env:RELEASE_VERSION.Contains("-")) { $arguments += "--prerelease" }
            $arguments += $assets
            gh @arguments
          }
