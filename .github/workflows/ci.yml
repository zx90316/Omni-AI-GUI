name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-syntax:
    name: Python syntax (${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q backend manager tests launch.py
      - name: Validate release packaging contract
        if: matrix.python-version == '3.12'
        run: python -m unittest -v tests.test_release_packaging

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git show --check needs the parent commit. With the default shallow
          # depth of one, Git treats HEAD like a root commit and reports every
          # pre-existing whitespace issue in the repository as newly added.
          fetch-depth: 2
      - name: Reject tracked runtime secrets and artifacts
        shell: bash
        run: |
          forbidden='(^|/)(\.env|omni_ai\.db|uploads|results|\.manager|node_modules|dist|\.venv)(/|$)'
          if git ls-files | grep -E "$forbidden"; then
            echo "Tracked runtime secret/artifact path detected."
            exit 1
          fi
      - name: Check whitespace errors
        run: git show --check --format= HEAD
